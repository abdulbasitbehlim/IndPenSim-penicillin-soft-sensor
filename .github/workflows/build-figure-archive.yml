name: Build high-resolution figure archive

on:
  push:
    branches:
      - main
    paths:
      - 'figures/paper_figures_600dpi.py'
      - 'figures/build_figure_archive.py'
      - '.github/workflows/build-figure-archive.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-figures:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install figure dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/baseline.txt python-pptx Pillow

      - name: Build organized figure archive
        run: python figures/build_figure_archive.py

      - name: Preserve original result-file link
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('results/main/README.md')
          text = p.read_text(encoding='utf-8')
          old = '[figure_2_fault_batch_rmse.png](../../figures/publishable_images/F2_fault_batch_rmse.png)'
          new = '[figure_2_fault_batch_rmse.png](figure_2_fault_batch_rmse.png)'
          if old in text:
              text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')
          PY

      - name: Validate image counts and DPI
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          root = Path('figures')
          for folder, expected in [('images_300_dpi',300),('images_600_dpi_original_code_output',600),('publishable_images',600)]:
              images = sorted((root/folder).glob('*.png'))
              assert len(images) == 14, (folder, len(images))
              for p in images:
                  with Image.open(p) as im:
                      dpi = im.info.get('dpi',(0,0))
                      assert abs(dpi[0]-expected) < 1 and abs(dpi[1]-expected) < 1, (p,dpi)
              print(folder, 'OK:', len(images), 'images at', expected, 'DPI')
          assert (root/'images_600_dpi_original_code_output'/'Original_Figure_as_Code_Output.pptx').is_file()
          assert (root/'publishable_images'/'Publications_Images.pptx').is_file()
          assert (root/'publishable_images'/'Publication_Ready_Figures_600dpi_with_legends.pptx').is_file()
          PY

      - name: Run repository checks
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Commit generated figure archive
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .gitattributes README.md docs/FIGURES.md results/main/README.md figures/
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git commit -m 'Add organized 300 and 600 DPI figure archive'
          git push origin main
